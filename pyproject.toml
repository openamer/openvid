[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvid"
version = "0.1.0"
description = "OPENVID — independent event-kernel ASI runtime"
requires-python = ">=3.10"

[project.scripts]
openvid = "openvid.cli:main"

[tool.setuptools.packages.find]
include = ["openvid*"]
